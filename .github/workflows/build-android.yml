name: Build Jadefall APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform/build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Bundle Three.js locally
        run: |
          mkdir -p android/app/src/main/assets/www
          curl -L "https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js" -o android/app/src/main/assets/www/three.module.js

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jadefall-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
